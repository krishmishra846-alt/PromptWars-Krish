name: Chitragupta.AI Continuous Integration & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-security:
    name: Backend Tests, Security Audit & Efficiency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        run: |
          cd backend
          python -m pytest -v --cov=. --cov-report=term-missing

  frontend-quality-and-accessibility:
    name: Frontend Accessibility, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Automated Unit & Accessibility Tests
        run: |
          cd frontend
          npm test

      - name: Run Production Bundle Build & Optimization Verification
        run: |
          cd frontend
          npm run build
