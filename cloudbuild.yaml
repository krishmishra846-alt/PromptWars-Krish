# Google Cloud Build Pipeline for BlindSpot AI
steps:
  # 1. Build container image using Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/blindspot-ai:$COMMIT_SHA', '.']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/blindspot-ai:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'blindspot-ai-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/blindspot-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/blindspot-ai:$COMMIT_SHA'
